<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="vx-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="vx-grad-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- VAPOR -->
  <text x="0" y="38" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900" fill="url(#vx-grad)" letter-spacing="1">VAPOR</text>
  <!-- -X -->
  <text x="173" y="38" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="url(#vx-grad)" letter-spacing="-1">-X</text>
  <!-- Subtle vapor wave -->
  <path d="M4 44 C 20 30, 35 52, 48 34" stroke="url(#vx-grad-v)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M10 50 C 22 40, 32 56, 44 42" stroke="url(#vx-grad-v)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
